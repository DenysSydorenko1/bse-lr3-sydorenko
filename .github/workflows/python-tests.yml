name: Python Tests CI

on:
  push:
    branches: [ "lr3-sydorenko", "main", "master" ]
  pull_request:
    branches: [ "lr3-sydorenko", "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Перевірка коду (Checkout)
      uses: actions/checkout@v4

    - name: Налаштування Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Встановлення залежностей
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov

    - name: Запуск тестів із перевіркою покриття (мінімум 80%)
      run: |
        py.test --cov=card_manager test_card_manager.py --cov-fail-under=80